name: Coolify checks
on:
  push:
    branches: [main, codex/studio-gq-coolify]
  pull_request:
  workflow_call:
    inputs:
      export_image:
        description: Save the checked Docker image for a publishing job.
        type: boolean
        default: false
    outputs:
      checked_image_artifact_id:
        description: Immutable artifact ID from the successful image verification job.
        value: ${{ jobs.verify.outputs.checked_image_artifact_id }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      checked_image_artifact_id: ${{ steps.checked_image.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build:vercel
      - run: node scripts/init-local-database.mjs .migration/ci.db
      - run: node tests/migration-smoke.mjs .migration/ci.db
      - run: node tests/migration-readonly.mjs .migration/ci.db
      - run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t studio-gq-test .
      - name: Verify the final container with an isolated database
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d "$RUNNER_TEMP/studio-gq-runtime.XXXXXX")"
          node scripts/init-local-database.mjs "$runtime_dir/smoke.db"
          sudo chown -R 1000:1000 "$runtime_dir"
          container="studio-gq-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then docker logs --tail 80 "$container" || true; fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT
          docker run -d --name "$container" --network none \
            --mount "type=bind,source=$runtime_dir,target=/app/data" \
            -e STUDIO_DATABASE_PATH=/app/data/smoke.db \
            -e APP_ORIGIN=http://127.0.0.1:3000 \
            -e EMAIL_DELIVERY_DISABLED=1 -e RESEND_API_KEY= \
            -e TURSO_DATABASE_URL= -e TURSO_AUTH_TOKEN= \
            -e FORJDECK_INTEGRATION_SECRET= -e FORJDECK_ALLOWED_ORGANIZATION_ID= \
            -e CREW_PORTAL_EMAIL=test@example.com \
            -e CREW_PORTAL_PASSWORD=synthetic-image-smoke-password \
            -e CREW_SESSION_SECRET=synthetic-image-smoke-session-secret-at-least-32-characters \
            studio-gq-test
          docker exec -i -e EXPECTED_COMMIT="$GITHUB_SHA" "$container" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';
          const origin = 'http://127.0.0.1:3000';
          const request = (path, body, cookie = '') => fetch(origin + path, {
            method: body === undefined ? 'GET' : 'POST', redirect: 'manual',
            signal: AbortSignal.timeout(5000),
            headers: { Origin: origin, 'Content-Type': 'application/json', ...(cookie ? { Cookie: cookie } : {}) },
            ...(body === undefined ? {} : { body: JSON.stringify(body) }),
          });
          let health;
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await request('/api/health');
              if (response.ok) { health = await response.json(); break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 500));
          }
          assert.ok(health, 'The final image must start and connect to its isolated database');
          assert.equal(health.status, 'ok');
          assert.equal(health.commit, process.env.EXPECTED_COMMIT, 'Version must come from the image, not a runtime override');
          for (const path of ['/', '/booking', '/crew/login']) assert.equal((await request(path)).status, 200, path);
          assert.equal((await request('/crew')).status, 307, 'Anonymous crew access must be denied');
          const login = await request('/api/crew/session', { password: process.env.CREW_PORTAL_PASSWORD });
          assert.equal(login.status, 200, 'Runtime crew credentials must work');
          const setCookie = login.headers.get('set-cookie');
          assert.match(setCookie, /HttpOnly/i);
          assert.match(setCookie, /Secure/i);
          assert.equal((await request('/crew', undefined, setCookie.split(';')[0])).status, 200);
          const booking = { requestId: randomUUID(), dates: ['2040-04-15'], session: 'morning',
            name: 'Image Smoke Test', company: 'Synthetic CI', email: 'image-smoke@example.com',
            phone: '+27845150956', additionalItems: [], message: '' };
          assert.equal((await request('/api/bookings', booking)).status, 201, 'Container must write its mounted SQLite database');
          assert.equal((await request('/api/bookings', { ...booking, requestId: randomUUID() })).status, 409, 'Conflicting booking must be rejected');
          console.log('PASS: final image starts, reports exact commit, serves pages, enforces login and writes isolated SQLite. Network and email delivery disabled.');
          NODE
      - name: Save the checked image
        if: ${{ inputs.export_image }}
        run: docker save studio-gq-test --output "${{ runner.temp }}/studio-gq-image.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: checked_image
        if: ${{ inputs.export_image }}
        with:
          name: studio-gq-checked-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/studio-gq-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
