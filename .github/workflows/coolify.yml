name: Coolify checks
on:
  push:
    branches: [main, codex/studio-gq-coolify]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build:vercel
      - run: node scripts/init-local-database.mjs .migration/ci.db
      - run: node tests/migration-smoke.mjs .migration/ci.db
      - run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t studio-gq-test .
